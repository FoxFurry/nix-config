# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-4,3440x1440@100,0x0,1
monitor=HDMI-A-2,1920x1080@75,760x1440,1
monitor=DP-5,1920x1080@60,3440x0,1

monitor=,preferred,auto,1
# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = $HOME/.config/waybar/launch.sh
exec-once = awww-daemon && sleep 1 && awww img /etc/nixos/assets/girl.png --outputs DP-4 --transition-type fade && awww img /etc/nixos/assets/castles.jpg --outputs HDMI-A-2 --transition-type fade && awww img /etc/nixos/assets/elden_ring.png --outputs DP-5 --transition-type fade
exec-once = dunst
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = [workspace special:terminal silent] kitty --class dropdown-terminal

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun -I -m -i

# Volume control (pipewire + wireplumber)
$volume-up = wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
$volume-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
$volume-mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
$screenshot = grim -g "$(slurp)" -t png - | wl-copy -t image/png

# Playback control (playerctl)
$play-pause = playerctl play-pause
$next = playerctl next
$previous = playerctl previous

# Some default env vars.
env = XCURSOR_SIZE,24

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = WLR_NO_HARDWARE_CURSORS,1

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:ctrl_space_toggle
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = -0.85 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    gaps_in = 4
    gaps_out = 8
    border_size = 3
    col.active_border = rgb(f5bde6) rgb(c6a0f6) 45deg
    col.inactive_border = rgba(363a4faa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    rounding = 14

    blur {
        enabled = true
        size = 5
        passes = 2
    }

    active_opacity = 1
    inactive_opacity = 0.95

    shadow {
        enabled = yes
        range = 12
        render_power = 2
        color = rgba(c6a0f688)
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    bezier = linear, 0.5, 0.5, 0.5, 0.5
    bezier = slowinout, 0.645, 0.045, 0.355, 1

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%

    animation = border, 1, 10, default
    animation = borderangle, 1, 20, linear, loop

    animation = fade, 1, 7, default
    animation = workspaces, 1, 3, slowinout, slidefade 20%

    animation = specialWorkspace, 1, 3, slowinout, fade
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
  new_status = master
}

gesture = 3, horizontal, workspace

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = -1 # Set to 0 to disable the anime mascot wallpapers
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more



# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# Syntax: windowrule = match:class <regex>, <effect> [value]

windowrule = match:class pavucontrol, float on

windowrule = match:class Dunst, rounding 10
windowrule = match:class Dunst, opacity 0.9

# Dropdown terminal window rules
windowrule = match:class dropdown-terminal, float on
windowrule = match:class dropdown-terminal, size 80% 60%
windowrule = match:class dropdown-terminal, center on
windowrule = match:class dropdown-terminal, workspace special:terminal silent

# Dropdown Spotify window rules
windowrule = match:class Spotify, float on
windowrule = match:class Spotify, size 80% 70%
windowrule = match:class Spotify, center on
windowrule = match:class Spotify, workspace special:music silent

# JetBrains GoLand - prevent popup focus stealing and flickering
windowrule = match:class ^jetbrains-goland$, match:title ^win, no_focus on
windowrule = match:class ^jetbrains-goland$, match:title ^win, match:float true, no_follow_mouse on
windowrule = match:class ^jetbrains-goland$, match:title ^win, rounding 0

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating, 
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspaces (scratchpads)
bind = $mainMod, X, togglespecialworkspace, magic
bind = $mainMod SHIFT, X, movetoworkspace, special:magic

# Dropdown terminal special workspace
workspace = special:terminal, gapsout:50
bind = , F12, togglespecialworkspace, terminal

# Dropdown Spotify player
workspace = special:music, gapsout:50
bind = $mainMod, S, togglespecialworkspace, music
bind = $mainMod, S, exec, [workspace special:music silent] spotify

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Keyboard Volume Control
bind = , XF86AudioRaiseVolume, exec, $volume-up
bind = , XF86AudioLowerVolume, exec, $volume-down
bind = , XF86AudioMute, exec, $volume-mute
bind = , XF86AudioPlay, exec, $play-pause
bind = , XF86AudioNext, exec, $next
bind = , XF86AudioPrev, exec, $previous

bind = $mainMod SHIFT, S, exec, $screenshot

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
debug:disable_logs = false
